<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <!-- Background gradient: dark green to deep green -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004d25"/>
      <stop offset="100%" stop-color="#00843D"/>
    </linearGradient>
    <!-- Gold shimmer for accent elements -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCC200"/>
      <stop offset="50%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FCC200"/>
    </linearGradient>
    <!-- Subtle radial highlight -->
    <radialGradient id="glow" cx="35%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00a84f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#004d25" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Decorative pitch lines (subtle) -->
  <circle cx="512" cy="250" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="512" cy="250" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>
  <circle cx="512" cy="250" r="290" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="512" y1="0" x2="512" y2="500" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Gold top accent bar -->
  <rect x="0" y="0" width="1024" height="5" fill="url(#gold)"/>
  <!-- Gold bottom accent bar -->
  <rect x="0" y="495" width="1024" height="5" fill="url(#gold)"/>

  <!-- Soccer ball icon (left side) -->
  <!-- Outer white circle -->
  <circle cx="220" cy="250" r="110" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="220" cy="250" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Soccer ball simplified (pentagon + hexagons) -->
  <g transform="translate(220,250)">
    <!-- Central pentagon (dark) -->
    <polygon points="0,-42 40,-13 25,34 -25,34 -40,-13" fill="#1a1a1a" opacity="0.9"/>
    <!-- Surrounding pentagons -->
    <polygon points="0,-75 18,-63 11,-40 -11,-40 -18,-63" fill="#1a1a1a" opacity="0.8" transform="rotate(0)"/>
    <polygon points="0,-75 18,-63 11,-40 -11,-40 -18,-63" fill="#1a1a1a" opacity="0.8" transform="rotate(72)"/>
    <polygon points="0,-75 18,-63 11,-40 -11,-40 -18,-63" fill="#1a1a1a" opacity="0.8" transform="rotate(144)"/>
    <polygon points="0,-75 18,-63 11,-40 -11,-40 -18,-63" fill="#1a1a1a" opacity="0.8" transform="rotate(216)"/>
    <polygon points="0,-75 18,-63 11,-40 -11,-40 -18,-63" fill="#1a1a1a" opacity="0.8" transform="rotate(288)"/>
    <!-- Ball outline circle -->
    <circle r="82" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- Main title: WC 2026 -->
  <text x="380" y="200"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="96"
    fill="url(#gold)"
    letter-spacing="-2">WC 2026</text>

  <!-- Subtitle: STICKERS -->
  <text x="382" y="272"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="52"
    fill="#ffffff"
    letter-spacing="8">STICKERS</text>

  <!-- Tagline -->
  <text x="382" y="330"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="22"
    fill="#ffffff"
    fill-opacity="0.75"
    letter-spacing="1">Track · Trade · Complete your album</text>

  <!-- Gold separator line under tagline -->
  <rect x="382" y="348" width="260" height="3" rx="2" fill="url(#gold)" opacity="0.8"/>

  <!-- Stats row -->
  <text x="382" y="400"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="18"
    fill="#FCC200"
    letter-spacing="0.5">48 TEAMS  ·  980 STICKERS  ·  100% OFFLINE</text>

  <!-- Small FIFA World Cup 2026 ref (bottom right) -->
  <text x="990" y="478"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    fill="#ffffff"
    fill-opacity="0.4"
    text-anchor="end">FIFA World Cup 2026™ Collector App</text>
</svg>
